<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>タイピングつりゲーム</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1b3a; --ink:#ffffff; --panel:#3b3b3b; --gold:#ffe066; --gold-d:#5a3b00;
  --key:#c6c6c6; --key-ink:#333333; --btn:#8b8b8b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#050c1c; --panel:#2f2f2f; --key:#b4b4b4; }
}
:root[data-theme="dark"]{ --bg:#050c1c; --panel:#2f2f2f; --key:#b4b4b4; }
*,*::before,*::after{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"DotGothic16","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
#app{height:100%;display:flex;flex-direction:column;position:relative}
#hud{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#1a1a1a;flex-wrap:wrap}
#hud .sp{flex:1}
.chip{background:#2b2b2b;border:3px solid;border-color:#111 #555 #555 #111;padding:6px 12px;font-size:clamp(13px,2vw,21px);text-shadow:2px 2px #000;white-space:nowrap}
.btn{
  font-family:inherit;font-size:clamp(14px,2.2vw,22px);color:#fff;text-shadow:2px 2px #3f3f3f;
  background:var(--btn);border:4px solid;border-color:#d8d8d8 #373737 #373737 #d8d8d8;
  padding:6px 14px;cursor:pointer;
}
.btn:active{border-color:#373737 #d8d8d8 #d8d8d8 #373737}
.btn.big{font-size:clamp(18px,3vw,30px);padding:10px 30px;background:#5b8f2e;border-color:#a8e06a #2d4a14 #2d4a14 #a8e06a}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
#c{position:absolute;left:0;top:0;display:block}
#kbd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 8px 10px;background:#1a1a1a}
.row{display:flex;gap:5px}
.k{
  width:clamp(28px,5.4vw,64px);height:clamp(26px,4.3vw,52px);display:flex;align-items:center;justify-content:center;
  font-family:inherit;font-size:clamp(15px,2.6vw,28px);color:var(--key-ink);background:var(--key);
  border:3px solid;border-color:#fff #555 #555 #fff;position:relative;cursor:pointer;
}
.k.bump{padding-bottom:clamp(4px,1vw,8px)}
.k[data-k="0"]::after{content:"";position:absolute;left:50%;top:50%;width:max(2px,.09em);height:1.05em;background:currentColor;transform:translate(-50%,-50%) rotate(24deg)}
.k.bump::after{content:"";position:absolute;bottom:2px;width:34%;height:2px;border-radius:1px;background:#666}
.k.on{background:var(--gold);color:var(--gold-d);border-color:#fff7c2 #a07800 #a07800 #fff7c2;box-shadow:0 0 14px 3px rgba(255,224,102,.85);animation:pulse 1s ease-in-out infinite}
.k.hit{background:#8fe05a}
.k.miss{background:#d98a8a}
@keyframes pulse{50%{box-shadow:0 0 22px 7px rgba(255,224,102,1)}}
@media (prefers-reduced-motion: reduce){.k.on{animation:none}}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,10,26,.84);z-index:5;padding:10px}
.ov.show{display:flex}
.panel{
  background:var(--panel);border:5px solid;border-color:#8a8a8a #151515 #151515 #8a8a8a;
  padding:clamp(12px,2.4vw,26px);width:min(980px,98vw);max-height:98%;overflow:auto;text-align:center;text-shadow:2px 2px #000;
}
.panel h1{font-size:clamp(26px,5vw,56px);color:var(--gold);text-shadow:4px 4px var(--gold-d);margin-bottom:8px;line-height:1.2}
.panel h2{font-size:clamp(22px,4vw,40px);color:var(--gold);text-shadow:3px 3px var(--gold-d);margin-bottom:8px}
.panel p{font-size:clamp(14px,2.2vw,22px);line-height:1.6;margin:8px 0}
.panel .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#lvGrid{display:grid;grid-template-columns:auto repeat(6,minmax(0,1fr));gap:6px;margin:10px 0;align-items:stretch}
.lh{font-size:clamp(10px,1.5vw,15px);line-height:1.3;padding:2px;color:#e8e8e8}
.lh small{display:block;color:#9fb4c8;font-size:.85em;word-break:break-all}
.rl{display:flex;align-items:center;justify-content:center;font-size:clamp(12px,2vw,20px);color:var(--gold);padding-right:6px;white-space:nowrap}
.lv{
  font-family:inherit;color:#fff;border:3px solid;border-color:#d8d8d8 #222 #222 #d8d8d8;padding:6px 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  font-size:clamp(12px,2vw,20px);text-shadow:2px 2px #000;min-height:clamp(46px,8vw,84px);
}
.lv:active{border-color:#222 #d8d8d8 #d8d8d8 #222}
.lv .ic{display:grid;grid-template-columns:repeat(2,auto);gap:2px;justify-content:center}
.lv .ic canvas{width:clamp(16px,2.8vw,30px);image-rendering:pixelated;aspect-ratio:16/10}
.lv .cl{font-size:.7em;color:#b6f23c}
.lv .sm{font-size:.62em;color:#dfe8f2}
#dexGrid,#resGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
@media (max-width:720px){#dexGrid,#resGrid{grid-template-columns:repeat(3,1fr)}}
.tile{
  font-family:inherit;color:#fff;background:#262626;border:3px solid;border-color:#111 #555 #555 #111;
  padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-shadow:1px 1px #000;
  font-size:clamp(10px,1.5vw,15px);
}
.tile.uncommon{border-color:#1f6b33 #5ee27a #5ee27a #1f6b33}
.tile.rare{border-color:#1b4f8a #4da6ff #4da6ff #1b4f8a}
.tile.epic{border-color:#5a2a86 #c88bff #c88bff #5a2a86;box-shadow:0 0 10px rgba(192,92,255,.6)}
.tile .rr{font-size:.72em;line-height:1.2}
.rr.r0{color:#b9c2ca}.rr.r1{color:#5ee27a}.rr.r2{color:#6db8ff}.rr.r3{color:#d9a0ff}
.tile.sel{background:#3d4a66}
.tile canvas{width:clamp(44px,8vw,88px);image-rendering:pixelated;aspect-ratio:16/10}
.tile .ct{color:#b6f23c}
.tile .nw{color:var(--gold)}
.tile .lvl{color:#8fa3b8;font-size:.85em}
#dexInfo{min-height:4.4em;font-size:clamp(14px,2.2vw,22px);line-height:1.6;background:#262626;border:3px solid;border-color:#111 #555 #555 #111;padding:8px 12px}
#dexPanel{display:flex;flex-direction:column;overflow:hidden}
#dexPanel h2,#dexPanel #dexInfo,#dexPanel .btns{flex:none}
#dexPanel #dexGrid{flex:1 1 auto;min-height:0;overflow-y:auto;align-content:start;-webkit-overflow-scrolling:touch}
#resNote{color:#b6f23c}
.dia{display:flex;flex-direction:column;align-items:center;gap:5px;margin:10px 0}
.dia .k{cursor:default;color:#222}
.dia .k.home{outline:3px solid #fff;outline-offset:1px}
.dia .k.fj{box-shadow:0 0 14px 3px rgba(255,255,255,.9);animation:pulse 1s ease-in-out infinite}
.dia .k.down{background:#7be06a !important;transform:translateY(2px)}
@media (prefers-reduced-motion: reduce){.dia .k.fj{animation:none}}
.legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.legend span{padding:3px 10px;color:#222;text-shadow:none;border:2px solid #222;font-size:clamp(11px,1.7vw,16px)}
.dexhead{grid-column:1/-1;text-align:left;color:var(--gold);font-size:clamp(13px,2vw,20px);padding:8px 4px 2px;border-bottom:2px solid #555}
.panel.pastel{background:#fdf3e2;border:4px dashed #f2a7b8;color:#5a4636;text-shadow:none}
.panel.pastel h2{color:#ff6f91;text-shadow:none;font-size:clamp(22px,4.2vw,44px);margin-bottom:4px}
.panel.pastel h2 em{font-style:normal;color:#4da6e8}
.panel.pastel p{color:#5a4636}
.panel.pastel p.lvname{color:#f08a24;font-size:clamp(14px,2.2vw,22px);margin:0 0 4px}
.panel.pastel b{color:#e0558a}
.panel.pastel p.go{color:#f08a24;text-shadow:none}
.dia svg{width:min(100%,720px);height:auto;display:block;overflow:hidden}
.hpwrap{position:relative;width:min(100%,720px);margin:0 auto}
.hpwrap img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.hpwrap .key{position:absolute;top:38.55%;width:7.58%;height:17.27%;border-radius:14%;pointer-events:none;box-sizing:border-box;border:3px solid transparent;transition:background .08s}
.hpwrap .key.f{left:31.04%}
.hpwrap .key.j{left:56.87%}
.hpwrap .key.fj{box-shadow:0 0 14px 3px rgba(255,255,255,.9);animation:pulse 1s ease-in-out infinite}
.hpwrap .key.down{background:rgba(123,224,106,.6);border-color:#4cbf3d}
@media (prefers-reduced-motion: reduce){.hpwrap .key.fj{animation:none}}
.dia .key text{font-family:"DotGothic16","Hiragino Sans",sans-serif;font-size:22px;fill:#4a3f55;text-anchor:middle;pointer-events:none}
.dia .key.down rect{fill:#7be06a}
.dia .hl{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{stroke-width:7}}
@media (prefers-reduced-motion: reduce){.dia .hl{animation:none}}
.panel p.go{font-size:clamp(18px,3vw,32px);color:var(--gold);text-shadow:3px 3px var(--gold-d)}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip" id="lvChip">Lv1</div>
    <div class="chip" id="cnt">つった かず 0 / 12</div>
    <div class="sp"></div>
    <button class="btn" id="bHome">ホーム</button>
    <button class="btn" id="bDex">ずかん</button>
    <button class="btn" id="bSnd">おと ON</button>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="kbd"></div>

  <div class="ov show" id="ovHome">
    <div class="panel">
      <h1>タイピングつりゲーム</h1>
      <div class="btns" style="margin-top:4px"><button class="btn big" id="bHomeDex">ずかん <span id="dexCnt"></span></button></div>
      <p>レベルを えらんでね</p>
      <div id="lvGrid"></div>
      <p style="font-size:clamp(11px,1.7vw,15px);color:#aab">スペースキー か Enter で、 まえに あそんだ レベルの じゅんびが できるよ。</p>
    </div>
  </div>

  <div class="ov" id="ovReady">
    <div class="panel pastel">
      <p id="rdTitle" class="lvname">Lv1</p>
      <h2>ホームポジションの <em>おぼえかた</em></h2>
      <p>ひだりの ひとさしゆびを <b>F</b>、 みぎの ひとさしゆびを <b>J</b> に のせよう！</p>
      <div class="dia" id="homeDia"></div>
      <p class="go">F と J を いっしょに おすと スタート！</p>
      <div class="btns">
        <button class="btn" id="bReadyBack">もどる</button>
        <button class="btn" id="bReadyTap" style="font-size:clamp(11px,1.6vw,15px)">キーボードが ないとき</button>
      </div>
    </div>
  </div>

  <div class="ov" id="ovDex">
    <div class="panel" id="dexPanel">
      <h2 id="dexTitle">ずかん</h2>
      <div id="dexGrid"></div>
      <div id="dexInfo">おさかなを おして みてね</div>
      <div class="btns"><button class="btn" id="bDexClose">とじる</button></div>
    </div>
  </div>

  <div class="ov" id="ovRes">
    <div class="panel">
      <h2>きょうの ちょうか</h2>
      <div id="resGrid"></div>
      <p id="resNote"></p>
      <div class="btns">
        <button class="btn big" id="bAgain">もういっかい</button>
        <button class="btn" id="bNext">つぎの レベル</button>
        <button class="btn" id="bResHome">ホーム</button>
        <button class="btn" id="bResDex">ずかん</button>
      </div>
    </div>
  </div>
</div>

    ["megamouth","メガマウスザメ","shark",{b:"#3a4a66",l:"#c0cce0",f:"#3a4a66"},"おおきな くちの めずらしい サメ。 プランクトンを たべるよ。"]

  ];
  const BASE_PAL = { o:"#1b2a3a", k:"#111111", w:"#ffffff" };
  // コモン / アンコモン / レア / エピック（でやすさ 63% / 30% / 5% / 2%）
  const RARITY = [
    { key:"common",   name:"コモン",     p:.63, speed:1,    color:"#b9c2ca" },
    { key:"uncommon", name:"アンコモン", p:.30, speed:1.05, color:"#5ee27a" },
    { key:"rare",     name:"レア",       p:.05, speed:1.2,  color:"#6db8ff" },
    { key:"epic",     name:"エピック",   p:.02, speed:1.3,  color:"#d9a0ff" }
  ];
  const FISH = DEFS.map(d => ({ id:d[0], name:d[1], shape:d[2], pal:d[3], tip:d[4], dots:d[5] || null }));
  const FISH_BY = {}; FISH.forEach(f => FISH_BY[f.id] = f);
  // 「コモン・アンコモン・レア・エピック」の じゅんばん。どのレベルで つれるかも さがしておく
  LEVELS.forEach(lv => {
    LEVEL_FISH[lv.set][lv.len - 1].forEach((id, i) => {
      const f = FISH_BY[id]; f.rarity = i; f.rare = (i >= 2); f.lv = lv;
    });
  });
  function buildSprite(f, sil){
    const c = document.createElement("canvas");
    c.width = 16; c.height = 10;
    const g = c.getContext("2d");
    const pal = Object.assign({}, BASE_PAL, f.pal);
    const rows = SHAPES[f.shape].map(r => (r + "................").slice(0, 16));
    const top = Math.floor((10 - rows.length) / 2);
    rows.forEach((row, y) => {
      for(let x = 0; x < 16; x++){
        const ch = row[x];
        if(ch === ".") continue;
        g.fillStyle = sil ? "#05080f" : (pal[ch] || "#ff00ff");
        g.fillRect(x, y + top, 1, 1);
      }
    });
    if(f.dots){
      g.fillStyle = sil ? "#05080f" : f.dots.c;
      f.dots.p.forEach(p => g.fillRect(p[0], p[1], 1, 1));
    }
    return c;
  }
  FISH.forEach(f => { f.img = buildSprite(f, false); f.sil = buildSprite(f, true); });

  /* ================= セーブ ================= */
  let save = { counts:{}, total:0, lv:{} };
  try{
    const j = JSON.parse(localStorage.getItem("fukaumi_v1"));
    if(j && j.counts) save = j;
  }catch(e){}
  save.lv = save.lv || {}; save.total = save.total || 0; save.last = save.last || 1;
  if(save.ver !== 2){   // 海の ならびが かわったので、 クリアの きろくも 海ごとに うつす
    const MV = [0, 3, 1, 2, 4, 5];   // むかしの 海の ばんごう → いまの ばんごう
    const mv = id => { const n = id - 1; return Math.floor(n / 6) * 6 + MV[n % 6] + 1; };
    const nl = {}; Object.keys(save.lv).forEach(k => { nl[mv(+k)] = save.lv[k]; });
    save.lv = nl; save.last = mv(save.last || 1); save.ver = 2;
  }
  function store(){ try{ localStorage.setItem("fukaumi_v1", JSON.stringify(save)); }catch(e){} }

  /* ================= 状態 ================= */
  const $ = s => document.querySelector(s);
  const cv = $("#c"), ctx = cv.getContext("2d"), stage = $("#stage");
  let W = 0, H = 0, P = 6, dpr = 1;
  const S = {
    mode:"home", paused:false, t:0, level:LEVELS[0], theme:THEMES[0],
    fishes:[], parts:[], bubbles:[], banners:[], banner:null, flash:0,
    spawnT:0, round:null, muted:false, lastKbd:"", lock:null
  };

  function resize(){
    const r = stage.getBoundingClientRect();
    W = Math.max(200, r.width); H = Math.max(160, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    P = Math.max(4, Math.round(W / 140));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    if(!S.bubbles.length){
      for(let i = 0; i < 24; i++) S.bubbles.push({ x:Math.random(), y:Math.random(), s:1 + Math.random() * 1.5, v:.03 + Math.random() * .06 });
    }
  }
  new ResizeObserver(resize).observe(stage);
  window.addEventListener("resize", resize);

  /* ================= 音 ================= */
  let AC = null;
  function initAudio(){
    try{
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if(AC.state === "suspended") AC.resume();
    }catch(e){}
  }
  function beep(freq, dur, type, vol, delay, slideTo){
    if(S.muted || !AC) return;
    try{
      const o = AC.createOscillator(), g = AC.createGain();
      const t = AC.currentTime + (delay || 0);
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || .06, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + dur + .02);
    }catch(e){}
  }
  const sfx = {
    tick(){ beep(660, .06, "square", .04); },
    catch(){ beep(500 + Math.random() * 300, .14, "triangle", .1, 0, 1500); beep(700 + Math.random() * 400, .14, "triangle", .08, .09, 1800); },
    rare(){ [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, .22, "square", .06, i * .09)); },
    epic(){ [392, 523, 659, 784, 1047, 1319, 1568, 2093].forEach((f, i) => beep(f, .26, "square", .06, i * .08)); [1047, 1319, 1568, 2093].forEach((f, i) => beep(f, .5, "triangle", .06, .7 + i * .02)); },
    miss(){ beep(170, .1, "sine", .05, 0, 120); },
    fresh(){ beep(880, .12, "square", .05); beep(1175, .2, "square", .05, .1); }
  };

  /* ================= 画面キーボード ================= */
  const kbd = $("#kbd");
  KEY_ROWS.forEach((row, i) => {
    const d = document.createElement("div");
    d.className = "row";
    if(i > 0) d.style.marginLeft = (i * 1.6) + "vw";
    row.split("").forEach(ch => {
      const k = document.createElement("div");
      k.className = "k" + ((ch === "F" || ch === "J") ? " bump" : "");
      k.dataset.k = ch; k.textContent = ch;
      k.addEventListener("pointerdown", e => { e.preventDefault(); handleKey(ch); });
      d.appendChild(k);
    });
    kbd.appendChild(d);
  });
  const keyEl = ch => kbd.querySelector('.k[data-k="' + ch + '"]');
  function flashKey(ch, cls){
    const el = keyEl(ch); if(!el) return;
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 180);
  }
  function neededKeys(){
    const swim = S.fishes.filter(o => o.state === "swim");
    if(S.lock && swim.includes(S.lock)) return [S.lock.word[S.lock.idx]];
    return swim.map(o => o.word[o.idx]);
  }
  function syncKbd(){
    const act = S.mode === "play" ? neededKeys().sort().join("") : "";
    if(act === S.lastKbd) return;
    S.lastKbd = act;
    kbd.querySelectorAll(".k").forEach(el => el.classList.toggle("on", act.includes(el.dataset.k)));
  }

  /* ================= HUD ================= */
  function hud(){
    const c = S.round ? S.round.count : 0;
    $("#cnt").textContent = "つった かず " + c + " / " + ROUND_N;
    $("#lvChip").textContent = "Lv" + S.level.id + " " + S.theme.name + " " + S.level.len + "もじ";
  }

  /* ================= 出現 ================= */
  function pickFish(){
    const list = S.level.fish.map(id => FISH_BY[id]);
    let r = Math.random();
    for(let i = 0; i < RARITY.length - 1; i++){
      if(r < RARITY[i].p) return list[i];
      r -= RARITY[i].p;
    }
    return list[RARITY.length - 1];
  }
  function makeWord(){
    const chars = SETS[S.level.set].chars;
    let w = "";
    for(let i = 0; i < S.level.len; i++) w += chars[Math.floor(Math.random() * chars.length)];
    return w;
  }
  function spawn(first){
    const used = S.fishes.filter(o => o.state === "swim");
    const avoid = used.map(o => o.word[o.idx]);
    let word = "", tries = 0;
    do { word = makeWord(); tries++; } while(avoid.includes(word[0]) && tries < 40);
    if(avoid.includes(word[0])) return;
    const f = pickFish();
    const lanes = [.3, .5, .7];
    const free = lanes.filter(l => !used.some(o => Math.abs(o.lane - l) < .01 && o.x > W * .5));
    const cand = free.length ? free : lanes;
    const lane = cand[Math.floor(Math.random() * cand.length)];
    const base = W * .07 / (1 + (S.level.len - 1) * .22);
    S.fishes.push({
      f, word, idx:0, lane, x:first ? W * .75 : W + 10, y:0, ph:Math.random() * 6,
      vx:-(base * RARITY[f.rarity].speed * (.9 + Math.random() * .25)),
      state:"swim", ct:0
    });
  }

  /* ================= 入力 ================= */
  function handleKey(ch){
    initAudio();
    if(S.mode !== "play" || S.paused) return;
    const swim = S.fishes.filter(o => o.state === "swim");
    let tgt = null;
    if(S.lock && swim.includes(S.lock) && S.lock.word[S.lock.idx] === ch) tgt = S.lock;
    if(!tgt) tgt = swim.filter(o => o.word[o.idx] === ch).sort((a, b) => a.x - b.x)[0] || null;
    if(!tgt){ sfx.miss(); flashKey(ch, "miss"); return; }
    flashKey(ch, "hit");
    tgt.idx++;
    if(tgt.idx >= tgt.word.length){
      if(S.lock === tgt) S.lock = null;
      catchFish(tgt);
    }else{
      S.lock = tgt; sfx.tick();
    }
  }
  function charOf(e){
    if(e.code && /^Key[A-Z]$/.test(e.code)) return e.code[3];
    if(e.code && /^(Digit|Numpad)[0-9]$/.test(e.code)) return e.code.slice(-1);
    if(/^[a-zA-Z0-9]$/.test(e.key)) return e.key.toUpperCase();
    return null;
  }
  const held = new Set();
  function markHeld(){
    document.querySelectorAll("#homeDia .key").forEach(el => el.classList.toggle("down", held.has(el.getAttribute("data-k"))));
    if(S.mode === "ready" && held.has("F") && held.has("J")){ held.clear(); startLevel(S.pendingId); }
  }
  window.addEventListener("keydown", e => {
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === "Escape"){ closeDex(); return; }
    const dexOpen = $("#ovDex").classList.contains("show");
    const ch = charOf(e);
    if(S.mode === "ready"){
      e.preventDefault();
      if(ch === "F" || ch === "J"){ held.add(ch); markHeld(); }
      return;
    }
    if(S.mode === "home" || S.mode === "result"){
      if(!dexOpen && !e.repeat && (e.key === "Enter" || e.key === " ")){
        e.preventDefault(); initAudio();
        goReady(S.mode === "result" ? S.level.id : save.last);
      }
      return;
    }
    if(e.key === " ") e.preventDefault();
    if(e.repeat) return;
    if(ch) handleKey(ch);
  });
  window.addEventListener("keyup", e => {
    const ch = charOf(e);
    if(ch){ held.delete(ch); if(S.mode === "ready") markHeld(); }
  });
  window.addEventListener("blur", () => { held.clear(); markHeld(); });

  /* ================= つり ================= */
  const BURST_N = [12, 18, 36, 64], BURST_V = [100, 110, 160, 210];
  const BURST_COL = [
    ["#b6f23c", "#7ee02b", "#d8ff7a"],
    ["#5ee27a", "#b6f23c", "#d8ff7a", "#ffffff"],
    ["#6db8ff", "#fff3a8", "#7fe9ff", "#ffffff"],
    ["#d9a0ff", "#ff8ad8", "#ffe066", "#7fe9ff", "#ffffff"]
  ];
  function burst(x, y, rarity){
    const n = BURST_N[rarity];
    for(let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2, sp = BURST_V[rarity] * (.4 + Math.random());
      const cols = BURST_COL[rarity];
      S.parts.push({ x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 40, life:0, max:.7 + Math.random() * .6, c:cols[Math.floor(Math.random() * cols.length)], s:P * (.5 + Math.random() * .7) });
    }
  }
  function catchFish(o){
    o.state = "caught"; o.ct = 0; o.y0 = o.y;
    burst(o.x + 8 * P, o.y + 5 * P, o.f.rarity);
    o.f.rarity >= 3 ? sfx.epic() : o.f.rarity === 2 ? sfx.rare() : sfx.catch();
    if(o.f.rarity >= 2) S.flash = 1;
  }
  function pushBanner(text, sub, color, dur){ S.banners.push({ text, sub, color:color || "#ffffff", dur:dur || 1.9, t:0 }); }
  function record(o){
    const f = o.f, r = S.round;
    const first = !(save.counts[f.id] > 0);
    save.counts[f.id] = (save.counts[f.id] || 0) + 1;
    save.total++;
    r.count++;
    const e = r.list.find(x => x.f === f);
    if(e) e.n++; else r.list.push({ f, n:1, isNew:first });
    if(f.rarity >= 3) pushBanner("エピック！！ " + f.name, "ものすごく めずらしい おさかな！", RARITY[3].color, 3.2);
    else if(f.rarity === 2) pushBanner("レア！ " + f.name, "めずらしい おさかな！", RARITY[2].color, 2.4);
    else if(first){ pushBanner("あたらしい！ " + f.name, "ずかんに のったよ", "#b6f23c"); sfx.fresh(); }
    if(r.count >= ROUND_N){
      save.lv[S.level.id] = (save.lv[S.level.id] || 0) + 1;
      S.mode = "ending"; setTimeout(endRound, 1500);
    }
    store();
  }

  /* ================= 画面の切りかえ ================= */
  function hideAll(){ document.querySelectorAll(".ov").forEach(el => el.classList.remove("show")); }
  function startLevel(id){
    const lv = LEVELS[Math.max(0, Math.min(LEVELS.length - 1, id - 1))];
    hideAll(); held.clear();
    S.level = lv; S.theme = THEMES[lv.set]; save.last = lv.id; store();
    S.mode = "play"; S.paused = false;
    S.round = { count:0, list:[] };
    S.fishes = []; S.parts = []; S.banners = []; S.banner = null; S.lastKbd = ""; S.lock = null;
    S.spawnT = 1.4;
    spawn(true);
    pushBanner("Lv" + lv.id + "  " + S.theme.name, lv.len + "もじ ・ " + SETS[lv.set].label.replace("\n", ""), "#9fc4ff", 1.8);

  function goHome(){
    S.mode = "home"; S.paused = false; S.fishes = []; S.lock = null; S.round = null;
    S.banners = []; S.banner = null; S.theme = THEMES[0]; S.lastKbd = ""; syncKbd();
    buildHome();
    hideAll(); $("#ovHome").classList.add("show");
  }
  function endRound(){
    S.mode = "result"; S.fishes = []; S.lock = null; S.lastKbd = ""; syncKbd();
    const g = $("#resGrid"); g.innerHTML = "";
    S.round.list.forEach(it => g.appendChild(tile(it.f, true, it.n, it.isNew, false)));
    const hasNext = S.level.id < LEVELS.length;
    $("#bNext").style.display = hasNext ? "" : "none";
    const newCnt = S.round.list.filter(it => it.isNew).length;
    $("#resNote").textContent = newCnt ? "ずかんに " + newCnt + "しゅ ふえたよ！" : "ほかの レベルにも いってみよう！ あたらしい さかなが いるよ。";
    $("#ovRes").classList.add("show");
  }

  /* ================= ホーム（レベル選択） ================= */
  function iconCanvas(f, known){
    const c = document.createElement("canvas");
    c.width = 16; c.height = 10;
    const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
    g.drawImage(known ? f.img : f.sil, 0, 0);
    return c;
  }
  function dexCount(){ return FISH.filter(f => save.counts[f.id] > 0).length; }
  function buildHome(){
    $("#dexCnt").textContent = dexCount() + " / " + FISH.length;
    const grid = $("#lvGrid"); grid.innerHTML = "";
    grid.appendChild(document.createElement("div"));
    SETS.forEach((s, i) => {
      const h = document.createElement("div"); h.className = "lh";
      h.innerHTML = s.label.replace("\n", "<br>") + "<small>" + THEMES[i].name + "</small>";
      grid.appendChild(h);
    });
    for(let len = 1; len <= MAXLEN; len++){
      const rl = document.createElement("div"); rl.className = "rl"; rl.textContent = len + "もじ";
      grid.appendChild(rl);
      for(let s = 0; s < 6; s++){
        const lv = LEVELS[(len - 1) * 6 + s];
        const b = document.createElement("button"); b.className = "lv";
        const th = THEMES[s];
        b.style.background = "linear-gradient(rgb(" + th.top + "), rgb(" + th.bot + "))";
        const t = document.createElement("span"); t.textContent = "Lv" + lv.id; b.appendChild(t);
        const ic = document.createElement("span"); ic.className = "ic";
        lv.fish.forEach(id => ic.appendChild(iconCanvas(FISH_BY[id], save.counts[id] > 0)));
        b.appendChild(ic);
        if(save.lv[lv.id]){ const cl = document.createElement("span"); cl.className = "cl"; cl.textContent = "クリア ×" + save.lv[lv.id]; b.appendChild(cl); }
        b.addEventListener("click", () => { initAudio(); goReady(lv.id); });
        grid.appendChild(b);
      }
    }
  }

  /* ================= ずかん ================= */
  function tile(f, known, n, isNew, showLv){
    const b = document.createElement("button");
    b.className = "tile" + (known && f.rarity > 0 ? " " + RARITY[f.rarity].key : "");
    b.appendChild(iconCanvas(f, known));
    const nm = document.createElement("span"); nm.textContent = known ? f.name : "？？？";
    b.appendChild(nm);
    if(known){ const rr = document.createElement("span"); rr.className = "rr r" + f.rarity; rr.textContent = RARITY[f.rarity].name; b.appendChild(rr); }
    if(known && n){ const ct = document.createElement("span"); ct.className = "ct"; ct.textContent = "×" + n; b.appendChild(ct); }
    if(isNew){ const nw = document.createElement("span"); nw.className = "nw"; nw.textContent = "あたらしい！"; b.appendChild(nw); }
    if(showLv){ const l = document.createElement("span"); l.className = "lvl"; l.textContent = "Lv" + f.lv.id; b.appendChild(l); }
    return b;
  }
  function openDex(){
    const grid = $("#dexGrid"); grid.innerHTML = "";
    let got = 0;
    for(let si = 0; si < 6; si++){
      const list = FISH.filter(f => f.lv.set === si).sort((x, y) => x.lv.id - y.lv.id || x.rarity - y.rarity);
      const gs = list.filter(f => save.counts[f.id] > 0).length; got += gs;
      const hd = document.createElement("div"); hd.className = "dexhead";
      hd.textContent = THEMES[si].name + "　" + gs + " / " + list.length;
      grid.appendChild(hd);
      list.forEach(f => {
        const n = save.counts[f.id] || 0;
        const t = tile(f, n > 0, n, false, true);
        t.addEventListener("click", () => {
          grid.querySelectorAll(".tile").forEach(x => x.classList.remove("sel"));
          t.classList.add("sel");
          $("#dexInfo").textContent = n > 0
            ? f.name + "（" + RARITY[f.rarity].name + "）： " + f.tip
            : "まだ つってないよ。 Lv" + f.lv.id + "（" + THEMES[f.lv.set].name + "・" + f.lv.len + "もじ）で つれるよ。";
        });
        grid.appendChild(t);
      });
    }
    $("#dexTitle").textContent = "ずかん  " + got + " / " + FISH.length;
    $("#dexInfo").textContent = "おさかなを おして みてね";
    if(S.mode === "play") S.paused = true;
    $("#ovDex").classList.add("show");
  }
  function closeDex(){
    $("#ovDex").classList.remove("show");
    if(S.mode === "play") S.paused = false;
    if(S.mode === "home") buildHome();
  }
  $("#bDex").addEventListener("click", () => { initAudio(); openDex(); });
  $("#bHomeDex").addEventListener("click", () => { initAudio(); openDex(); });
  $("#bResDex").addEventListener("click", openDex);
  $("#bDexClose").addEventListener("click", closeDex);
  $("#bHome").addEventListener("click", () => { goHome(); });
  $("#bResHome").addEventListener("click", () => { goHome(); });
  $("#bAgain").addEventListener("click", () => { initAudio(); goReady(S.level.id); });
  $("#bNext").addEventListener("click", () => { initAudio(); goReady(S.level.id + 1); });
  $("#bReadyBack").addEventListener("click", goHome);
  $("#bReadyTap").addEventListener("click", () => { initAudio(); startLevel(S.pendingId); });
  $("#bSnd").addEventListener("click", () => {
    S.muted = !S.muted; $("#bSnd").textContent = "おと " + (S.muted ? "OFF" : "ON");
  });

  /* ================= 描画 ================= */
  const rnd = (i, j) => { const v = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return v - Math.floor(v); };
  const FLOORS = { sand:["#dcc382", "#c7ab62"], rock:["#4a5568", "#394253"], deep:["#222a44", "#171d33"], ice:["#eaf5fc", "#d3e8f4"] };

  function drawBG(){
    const th = S.theme, B = P * 5;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "rgb(" + th.top + ")"); g.addColorStop(1, "rgb(" + th.bot + ")");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for(let cy = 0; cy * B < H; cy++){
      for(let cx = 0; cx * B < W; cx++){
        const n = rnd(cx, cy);
        if(n > .55){
          ctx.fillStyle = "rgba(255,255,255," + ((n - .55) * (th.dark ? .07 : .2)) + ")";
          ctx.fillRect(cx * B, cy * B, B, B);
        }else if(n < .2){
          ctx.fillStyle = "rgba(0,0,40," + ((.2 - n) * .3) + ")";
          ctx.fillRect(cx * B, cy * B, B, B);
        }
      }
    }
    if(th.waves){
      ctx.fillStyle = "rgba(255,255,255,.55)";
      for(let cx = 0; cx * B < W + B; cx++){
        ctx.fillRect(cx * B, Math.round(Math.sin(S.t * 1.5 + cx) * P * .7), B - P, P * 2);
      }
    }
    if(th.ice){
      ctx.fillStyle = "rgba(240,250,255,.92)";
      for(let cx = 0; cx * B < W; cx++){
        if(rnd(cx, 55) > .4) ctx.fillRect(cx * B, 0, B, Math.round(P * th.ice));
      }
    }
    const fy = H - B;
    if(th.floor){
      const fc = FLOORS[th.floor];
      for(let cx = 0; cx * B < W; cx++){
        const n = rnd(cx, 99);
        ctx.fillStyle = n > .5 ? fc[0] : fc[1]; ctx.fillRect(cx * B, fy, B, B);
        ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(cx * B, fy, B, P);
      }
    }
    if(th.weed === "green" || th.weed === "coral"){
      for(let k = 0; k < 6; k++){
        const bx = Math.round(W * (k + .5) / 6 + rnd(k, 5) * P * 6);
        const h = 3 + Math.floor(rnd(k, 7) * 3);
        for(let j = 0; j < h; j++){
          const sway = Math.sin(S.t * 1.4 + k + j * .5) * P * .8 * (j / h);
          if(th.weed === "green") ctx.fillStyle = j % 2 ? "#2e9c4a" : "#3dbd5d";
          else ctx.fillStyle = (k + j) % 2 ? "#ff6f91" : "#ff9671";
          const wd = th.weed === "coral" ? P * (j === h - 1 ? 4 : 3) : P * 2;
          ctx.fillRect(Math.round(bx + sway), fy - (j + 1) * P * 3, wd, P * 3);
        }
      }
    }
    if(th.weed === "rock"){
      for(let k = 0; k < 5; k++){
        const bx = Math.round(W * (k + .5) / 5 + rnd(k, 5) * P * 8);
        ctx.fillStyle = "#5a6478"; ctx.fillRect(bx, fy - P * 4, P * 8, P * 4);
        ctx.fillStyle = "#6c778c"; ctx.fillRect(bx + P, fy - P * 7, P * 5, P * 3);
      }
    }
    if(th.glow){
      for(let k = 0; k < 18; k++){
        const x = rnd(k, 3) * W, y = H * (.1 + rnd(k, 4) * .8);
        const tw = .3 + .7 * Math.abs(Math.sin(S.t * (.5 + rnd(k, 8)) + k));
        ctx.globalAlpha = tw * .7;
        ctx.fillStyle = k % 3 ? "#7fe9ff" : "#c9a6ff";
        ctx.fillRect(Math.round(x), Math.round(y), P, P);
      }
      ctx.globalAlpha = 1;
    }
  }
  function drawBubbles(dt){
    ctx.fillStyle = "rgba(255,255,255,.35)";
    S.bubbles.forEach(b => {
      b.y -= b.v * dt; if(b.y < -.05){ b.y = 1.02; b.x = Math.random(); }
      const s = Math.round(P * b.s);
      ctx.fillRect(Math.round(b.x * W + Math.sin(S.t + b.x * 9) * P), Math.round(b.y * H), s, s);
    });
  }
  const FONT = 'px "DotGothic16","Hiragino Sans",sans-serif';
  function drawFish(o){
    const f = o.f, w = 16 * P, h = 10 * P;
    let x = Math.round(o.x), y = o.y;
    if(o.state === "swim") y += Math.sin(S.t * 2 + o.ph) * P * 1.5;
    if(o.state === "caught"){
      const e = o.ct * o.ct;
      y = o.y0 - e * (o.y0 + h + P * 12);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(Math.round(x + w * .35), 0, Math.max(2, P * .5), Math.max(0, y + h * .3));
    }
    y = Math.round(y);
    if(f.rarity >= 2){
      const epic = f.rarity >= 3;
      const gc = epic ? "200,120,255" : "110,190,255";
      const pr = .6 + .4 * Math.sin(S.t * (epic ? 6 : 4) + o.ph);
      const gr = ctx.createRadialGradient(x + w / 2, y + h / 2, P, x + w / 2, y + h / 2, w * (epic ? 1.25 : .95));
      gr.addColorStop(0, "rgba(" + gc + "," + ((epic ? .75 : .55) * pr) + ")");
      gr.addColorStop(1, "rgba(" + gc + ",0)");
      ctx.fillStyle = gr; ctx.fillRect(x - w, y - h, w * 3, h * 3);
    }
    ctx.drawImage(f.img, x, y, w, h);
    if(o.state === "swim"){
      const n = o.word.length, cw = P * 7, sw = n * cw + P * 2, sh = P * 12;
      const sx = Math.round(x + (w - sw) / 2), sy = Math.round(y - sh - P);
      ctx.fillStyle = S.lock === o ? "#ffd23f" : "#6b4423"; ctx.fillRect(sx, sy, sw, sh);
      ctx.fillStyle = "#b8864b"; ctx.fillRect(sx + P, sy + P, sw - P * 2, sh - P * 2);
      ctx.fillStyle = "#e8c98a"; ctx.fillRect(sx + P * 1.5, sy + P * 1.5, sw - P * 3, sh - P * 3);
      ctx.font = (P * 5.6) + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for(let i = 0; i < n; i++){
        const cx = sx + P + cw * i + cw / 2;
        ctx.fillStyle = i < o.idx ? "#4f9a4f" : "#3a2410";
        ctx.fillText(o.word[i], cx, sy + P * 5.4);
        if(o.word[i] === "0"){
          ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = Math.max(2, P * .7); ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(cx + P * 1.5, sy + P * 3.2); ctx.lineTo(cx - P * 1.5, sy + P * 7.6); ctx.stroke();
        }
        if(i === o.idx){
          ctx.fillStyle = "#c0392b";
          ctx.fillRect(Math.round(cx - cw / 2 + P), Math.round(sy + P * 9.2), Math.round(cw - P * 2), Math.max(2, Math.round(P * .9)));
        }
      }
    }
  }
  function drawBanner(){
    const b = S.banner; if(!b) return;
    const a = Math.min(1, b.t / .2, (b.dur - b.t) / .3);
    ctx.globalAlpha = Math.max(0, a);
    const bw = Math.min(W * .92, P * 90), bh = P * 20, bx = (W - bw) / 2, by = H * .3 - bh / 2;
    ctx.fillStyle = "rgba(10,14,28,.88)"; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = b.color; ctx.lineWidth = P * .6; ctx.strokeRect(bx, by, bw, bh);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = b.color; ctx.font = (P * 5) + FONT;
    ctx.fillText(b.text, W / 2, by + bh * .38, bw - P * 4);
    ctx.fillStyle = "#ffffff"; ctx.font = (P * 2.6) + FONT;
    ctx.fillText(b.sub, W / 2, by + bh * .76, bw - P * 4);
    ctx.globalAlpha = 1;
  }

  /* ================= メインループ ================= */
  let last = performance.now();
  function loop(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if(!S.paused){
      S.t += dt;
      if(S.mode === "play"){
        S.spawnT -= dt;
        const maxFish = S.level.len >= 3 ? 2 : (save.total < 12 ? 2 : 3);
        const swimming = S.fishes.filter(o => o.state === "swim").length;
        if(S.spawnT <= 0 && swimming < maxFish){ spawn(false); S.spawnT = 1.6 + Math.random() * 1.6; }
        else if(S.spawnT <= 0) S.spawnT = .6;
      }
      S.fishes.forEach(o => {
        o.y = H * o.lane - 5 * P;
        if(o.state === "swim") o.x += o.vx * dt; else o.ct += dt / .8;
      });
      for(let i = S.fishes.length - 1; i >= 0; i--){
        const o = S.fishes[i];
        if(o.state === "caught" && o.ct >= 1){ S.fishes.splice(i, 1); record(o); }
        else if(o.state === "swim" && o.x < -16 * P - 10){ // にげても ペナルティなし
          S.fishes.splice(i, 1); if(S.lock === o) S.lock = null;
        }
      }
      S.parts.forEach(p => {
        p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= .96; p.vy = p.vy * .96 - 30 * dt;
      });
      S.parts = S.parts.filter(p => p.life < p.max);
      if(!S.banner && S.banners.length) S.banner = S.banners.shift();
      if(S.banner){ S.banner.t += dt; if(S.banner.t >= S.banner.dur) S.banner = null; }
      S.flash = Math.max(0, S.flash - dt * 2.5);
      syncKbd(); hud();
    }
    drawBG();
    drawBubbles(S.paused ? 0 : dt);
    S.fishes.forEach(drawFish);
    S.parts.forEach(p => {
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
    });
    ctx.globalAlpha = 1;
    drawBanner();
    if(S.flash > 0){ ctx.fillStyle = "rgba(255,255,255," + (S.flash * .45) + ")"; ctx.fillRect(0, 0, W, H); }
    requestAnimationFrame(loop);
  }
  resize();
  buildHome();
  buildDiagram();
  requestAnimationFrame(loop);
})();
</script>
